<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05121c">
<title>Panel · Orión Equipo</title>
<style>
  :root {
    --fondo: #05121c; --panel: #0b2131; --borde: #17405a; --texto: #d8f3ff; --tenue: #7aa6bd;
    --acento: #2ad4ff; --ok: #4ade80; --error: #ff7a7a; --aviso: #ffcf5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--borde); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header b { color: var(--acento); letter-spacing: .04em; }
  header .sw { margin-left: auto; display: flex; gap: 6px; }
  header .sw a { font-size: 13px; padding: 5px 10px; border: 1px solid var(--borde); border-radius: 8px;
    color: var(--texto); text-decoration: none; }
  header .sw a.activo { background: var(--acento); color: #04202c; border-color: var(--acento); font-weight: 600; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  section { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--acento); }
  .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--borde); }
  .fila:first-of-type { border-top: 0; }
  .crece { flex: 1; min-width: 160px; }
  .tenue { color: var(--tenue); font-size: 13px; }
  button, input, select { font: inherit; }
  button { border: 0; border-radius: 8px; padding: 7px 12px; background: var(--acento); color: #04202c; font-weight: 600; cursor: pointer; }
  button.gris { background: #1b3b50; color: var(--texto); }
  button.rojo { background: #5a1f2a; color: #ffd7dc; }
  input, select { padding: 10px; border-radius: 8px; border: 1px solid var(--borde); background: #07192485; color: var(--texto); }
  #login { max-width: 340px; margin: 10vh auto; }
  #login input { width: 100%; margin: 8px 0; }
  #login button { width: 100%; padding: 12px; }
  .error { color: var(--error); min-height: 1.3em; font-size: 14px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--borde); }
  .pill.activa { color: var(--aviso); border-color: var(--aviso); }
  .pill.alta { color: var(--error); border-color: var(--error); }
  .vacio { color: var(--tenue); font-size: 14px; padding: 6px 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #07192480; padding: 10px; border-radius: 8px; font-size: 13px; }
  .doc-informe { background: #07192480; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
  .doc-informe img { max-width: 100%; border-radius: 8px; display: block; margin: 8px 0; }
  .doc-informe h3 { color: var(--acento); font-size: 15px; margin: 10px 0 4px; }
</style>
</head>
<body>
<form id="login">
  <h2>Panel de Orión Equipo</h2>
  <input id="clave" type="password" placeholder="Clave del panel" autocomplete="current-password">
  <input id="codigo" inputmode="numeric" placeholder="Código de 6 dígitos (si lo activaste)" autocomplete="one-time-code">
  <button type="submit">Entrar</button>
  <p id="login-error" class="error"></p>
</form>

<div id="app" hidden>
  <header>
    <b>ORIÓN · PANEL</b>
    <nav class="sw">
      <a class="activo" href="#">Orión Equipo</a>
      <a id="ir-hallazgos" href="#">Hallazgos Viales</a>
    </nav>
    <button class="gris" id="salir">Salir</button>
  </header>
  <main>
    <section>
      <h2>Estado</h2>
      <div class="fila"><span class="crece" id="resumen">…</span>
        <button id="pausa"></button></div>
    </section>

    <section>
      <h2>Autorizaciones pendientes</h2>
      <div id="autorizaciones"><div class="vacio">Nada pendiente.</div></div>
      <p class="tenue">Son pruebas activas que el equipo quiere correr contra tus sistemas. Nada corre hasta que apruebes.</p>
    </section>

    <section>
      <h2>Equipo</h2>
      <div id="personas"></div>
    </section>

    <section>
      <h2>Alertas recientes</h2>
      <div id="alertas"></div>
    </section>

    <section>
      <h2>Informes de la sesión</h2>
      <div id="informes"><div class="vacio">Todavía no hay informes.</div></div>
    </section>
  </main>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { ...opciones, headers: { "Content-Type": "application/json", "X-OE": "1" } });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(datos.error || r.status), { codigo: r.status });
  return datos;
}
const esc = (t) => { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; };

async function cargar() {
  try {
    const [est, aut, ale, inf] = await Promise.all([
      api("/panel/api/estado"), api("/panel/api/autorizaciones"),
      api("/panel/api/alertas"), api("/panel/api/informes")]);
    $("resumen").innerHTML = `${est.personas.length} en el equipo · ${est.pendientes} pendiente(s) de autorizar · ` +
      (est.pausa ? '<b style="color:var(--error)">EN PAUSA</b>' : 'funcionando');
    $("pausa").textContent = est.pausa ? "Reanudar" : "Pausar todo";
    $("pausa").className = est.pausa ? "" : "rojo";
    $("pausa").onclick = async () => { await api("/panel/api/pausa", { method: "POST", body: JSON.stringify({ activar: !est.pausa }) }); cargar(); };

    $("autorizaciones").innerHTML = aut.pendientes.length ? "" : '<div class="vacio">Nada pendiente.</div>';
    for (const p of aut.pendientes) {
      const d = document.createElement("div");
      d.className = "fila";
      d.innerHTML = `<span class="crece"><b>${esc(p.persona)}</b> quiere <b>${esc(p.herramienta)}</b> ` +
        `<span class="pill ${p.tipo}">${esc(p.tipo)}</span><br><span class="tenue">contra ${esc(p.objetivo)} ${esc(p.args || "")}</span></span>` +
        `<select><option value="2">2 h</option><option value="8" selected>8 h</option><option value="24">24 h</option></select>` +
        `<button>Autorizar</button><button class="rojo">Rechazar</button>`;
      const [sel, ok, no] = [d.querySelector("select"), ...d.querySelectorAll("button")];
      ok.onclick = async () => { await api("/panel/api/autorizar", { method: "POST", body: JSON.stringify({ id: p.id, horas: +sel.value }) }); cargar(); };
      no.onclick = async () => { await api("/panel/api/denegar", { method: "POST", body: JSON.stringify({ id: p.id }) }); cargar(); };
      $("autorizaciones").append(d);
    }

    $("personas").innerHTML = est.personas.length ? "" : '<div class="vacio">Nadie todavía. Agrégalos con ./equipo/persona.sh</div>';
    for (const nombre of est.personas) {
      const d = document.createElement("div");
      d.className = "fila";
      const hoy = est.pedidos_hoy[nombre] || 0;
      d.innerHTML = `<span class="crece">${esc(nombre)} <span class="tenue">· ${hoy} pedido(s) hoy</span></span><button class="rojo">Quitar</button>`;
      d.querySelector("button").onclick = async () => {
        if (!confirm("¿Quitar a " + nombre + "? Dejará de entrar al instante.")) return;
        await api("/panel/api/quitar", { method: "POST", body: JSON.stringify({ nombre }) }); cargar();
      };
      $("personas").append(d);
    }

    $("alertas").innerHTML = ale.alertas.length ? "" : '<div class="vacio">Sin alertas.</div>';
    for (const a of ale.alertas.slice(0, 40)) {
      const d = document.createElement("div");
      d.className = "fila";
      d.innerHTML = `<span class="crece">${esc(a.texto)}</span><span class="tenue">${esc(a.hora.replace("T", " "))}</span>`;
      $("alertas").append(d);
    }

    $("informes").innerHTML = inf.informes.length ? "" : '<div class="vacio">Todavía no hay informes.</div>';
    for (const f of inf.informes) {
      const det = document.createElement("details");
      // f.html ya viene saneado desde el servidor (lista blanca de etiquetas, imágenes solo data:).
      const cuerpo = f.html != null ? `<div class="doc-informe">${f.html}</div>` : `<pre>${esc(f.texto)}</pre>`;
      det.innerHTML = `<summary>${esc(f.archivo)}</summary>${cuerpo}`;
      $("informes").append(det);
    }
  } catch (e) {
    if (e.codigo === 401) mostrarLogin();
  }
}

function mostrarApp() { $("login").hidden = true; $("app").hidden = false; cargar(); setInterval(cargar, 8000); }
function mostrarLogin() { $("app").hidden = true; $("login").hidden = false; }

$("login").onsubmit = async (e) => {
  e.preventDefault();
  $("login-error").textContent = "";
  try {
    await api("/panel/api/entrar", { method: "POST", body: JSON.stringify({ clave: $("clave").value, codigo: $("codigo").value }) });
    $("clave").value = $("codigo").value = "";
    mostrarApp();
  } catch (err) {
    $("login-error").textContent = err.codigo === 429 ? "Demasiados intentos, espera unos minutos." : (err.message || "No pude entrar.");
  }
};
$("salir").onclick = async () => { try { await api("/panel/api/salir", { method: "POST" }); } catch (e) {} mostrarLogin(); };
// El switcher de proyectos: el enlace al panel de Hallazgos lo pone David (ver equipo/README.md).
$("ir-hallazgos").onclick = (e) => { e.preventDefault(); alert("Pon aquí el enlace de tu panel de Hallazgos (api.ubuntulabs.co/panel). Ver equipo/README.md."); };

api("/panel/api/sesion").then((s) => s.dentro ? mostrarApp() : mostrarLogin()).catch(mostrarLogin);
</script>
</body>
</html>
