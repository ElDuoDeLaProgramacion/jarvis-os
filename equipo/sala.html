<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05121c">
<title>Orión Equipo</title>
<style>
  :root {
    --fondo: #05121c; --panel: #0b2131; --borde: #17405a; --texto: #d8f3ff; --tenue: #7aa6bd;
    --acento: #2ad4ff; --yo: #12405a; --otro: #0f2a3d; --error: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--borde); display: flex; gap: 8px; align-items: baseline; }
  header b { color: var(--acento); letter-spacing: .04em; }
  header span { color: var(--tenue); font-size: 14px; margin-left: auto; }
  header a { color: var(--tenue); font-size: 13px; text-decoration: none; }
  #mensajes { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: min(720px, 92%); padding: 8px 12px; border-radius: 12px; background: var(--otro);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.mio { align-self: flex-end; background: var(--yo); }
  .m.orion { border: 1px solid var(--borde); background: var(--panel); }
  .m small { display: block; color: var(--tenue); font-size: 12px; margin-bottom: 2px; }
  #aviso-pausa { display: none; color: var(--error); padding: 0 16px 6px; font-size: 14px; }
  #pensando { color: var(--tenue); font-size: 14px; padding: 0 16px 6px; min-height: 1.4em; }
  form { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--borde); }
  textarea { flex: 1; resize: none; height: 48px; border-radius: 10px; border: 1px solid var(--borde);
    background: var(--panel); color: var(--texto); padding: 10px; font: inherit; }
  button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--acento); color: #04202c; font-weight: 600; cursor: pointer; }
  #entrar { margin: auto; padding: 24px 16px; max-width: 360px; width: 100%; }
  #entrar h1 { color: var(--acento); font-size: 20px; text-align: center; }
  #entrar input { width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: 1px solid var(--borde);
    background: var(--panel); color: var(--texto); font: inherit; }
  #entrar button { width: 100%; padding: 12px; margin-top: 8px; }
  .error { color: var(--error); min-height: 1.3em; font-size: 14px; }
</style>
</head>
<body>
<header hidden id="barra"><b>ORIÓN · EQUIPO</b><span id="yo"></span><a href="#" id="informe">Mi informe</a><a href="#" id="salir">Salir</a></header>
<form id="entrar" autocomplete="on">
  <h1>Orión Equipo</h1>
  <input id="usuario" name="username" placeholder="Usuario" autocomplete="username" autocapitalize="none">
  <input id="clave" name="password" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button type="submit">Entrar</button>
  <p id="aviso" class="error"></p>
</form>
<div id="mensajes" hidden></div>
<div id="aviso-pausa">Orión está en pausa (David lo detuvo). Vuelve en un rato.</div>
<div id="pensando"></div>
<form id="form" hidden>
  <textarea id="texto" placeholder="Pregúntale a Orión. Enter envía, Shift+Enter baja de línea."></textarea>
  <button type="submit">Enviar</button>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let nombre = "", ultimo = 0, timer = null;

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { ...opciones, headers: { "Content-Type": "application/json", "X-OE": "1" } });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(datos.error || r.status), { codigo: r.status });
  return datos;
}

function pintar(m) {
  const div = document.createElement("div");
  div.className = "m" + (m.de === "orion" ? " orion" : m.de === nombre ? " mio" : "");
  const quien = document.createElement("small");
  quien.textContent = (m.de === "orion" ? "Orión" : m.de) + " · " + m.hora;
  div.append(quien, document.createTextNode(m.texto));
  $("mensajes").append(div);
}

async function leer() {
  try {
    const d = await api("/api/sala?desde=" + ultimo);
    const caja = $("mensajes");
    const abajo = caja.scrollHeight - caja.scrollTop - caja.clientHeight < 80;
    for (const m of d.mensajes) { pintar(m); ultimo = m.n; }
    if (d.mensajes.length && abajo) caja.scrollTop = caja.scrollHeight;
    $("pensando").textContent = d.ocupado ? "Orión está trabajando…" : "";
    $("aviso-pausa").style.display = d.pausa ? "block" : "none";
  } catch (e) {
    if (e.codigo === 401) salir();
  }
}

function mostrarSala() {
  $("entrar").hidden = true;
  $("barra").hidden = false;
  $("mensajes").hidden = $("form").hidden = false;
  $("yo").textContent = nombre;
}

function salir() {
  nombre = ""; ultimo = 0;
  if (timer) { clearInterval(timer); timer = null; }
  $("entrar").hidden = false;
  $("barra").hidden = true;
  $("mensajes").hidden = $("form").hidden = true;
  $("mensajes").innerHTML = "";
}

async function arranque() {
  try {
    nombre = (await api("/api/yo")).nombre;
    mostrarSala();
    await leer();
    $("mensajes").scrollTop = $("mensajes").scrollHeight;
    timer = setInterval(leer, 2500);
  } catch (e) { salir(); }
}

$("entrar").onsubmit = async (e) => {
  e.preventDefault();
  $("aviso").textContent = "";
  try {
    await api("/api/entrar", { method: "POST", body: JSON.stringify(
      { usuario: $("usuario").value.trim(), clave: $("clave").value }) });
    $("clave").value = "";
    arranque();
  } catch (err) {
    $("aviso").textContent = err.codigo === 429 ? "Demasiados intentos, espera unos minutos." : "Usuario o contraseña incorrectos.";
  }
};
$("informe").onclick = async (e) => {
  e.preventDefault();
  const texto = prompt("Tu informe de seguridad de la sesión (qué hiciste, qué encontraste, cómo lo comprobaste, qué aprendiste):");
  if (!texto || texto.trim().length < 20) { if (texto !== null) alert("Escribe un poco más."); return; }
  try { await api("/api/informe", { method: "POST", body: JSON.stringify({ texto: texto.trim() }) });
    alert("Enviado. ¡Gracias!"); } catch (err) { alert("No se envió: " + err.message); }
};
$("salir").onclick = async (e) => {
  e.preventDefault();
  try { await api("/api/salir", { method: "POST" }); } catch (err) {}
  salir();
};
$("texto").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const texto = $("texto").value.trim();
  if (!texto) return;
  try {
    await api("/api/pedir", { method: "POST", body: JSON.stringify({ texto }) });
    $("texto").value = "";
    leer();
  } catch (err) {
    $("pensando").textContent = "No se envió: " + err.message;
  }
};
arranque();
</script>
</body>
</html>
