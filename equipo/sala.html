<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05121c">
<title>Orión Equipo</title>
<style>
  :root {
    --fondo: #05121c; --panel: #0b2131; --borde: #17405a; --texto: #d8f3ff; --tenue: #7aa6bd;
    --acento: #2ad4ff; --yo: #12405a; --otro: #0f2a3d; --error: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--borde); display: flex; gap: 8px; align-items: baseline; }
  header b { color: var(--acento); letter-spacing: .04em; }
  header span { color: var(--tenue); font-size: 14px; margin-left: auto; }
  #mensajes { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: min(720px, 92%); padding: 8px 12px; border-radius: 12px; background: var(--otro);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.mio { align-self: flex-end; background: var(--yo); }
  .m.orion { border: 1px solid var(--borde); background: var(--panel); }
  .m small { display: block; color: var(--tenue); font-size: 12px; margin-bottom: 2px; }
  #pensando { color: var(--tenue); font-size: 14px; padding: 0 16px 6px; min-height: 1.4em; }
  form { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--borde); }
  textarea { flex: 1; resize: none; height: 48px; border-radius: 10px; border: 1px solid var(--borde);
    background: var(--panel); color: var(--texto); padding: 10px; font: inherit; }
  button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--acento); color: #04202c; font-weight: 600; }
  #entrar { margin: auto; padding: 24px 16px; max-width: 420px; text-align: center; color: var(--tenue); }
  #entrar input { width: 100%; margin: 12px 0; padding: 10px; border-radius: 10px; border: 1px solid var(--borde);
    background: var(--panel); color: var(--texto); font: inherit; }
  .error { color: var(--error); }
</style>
</head>
<body>
<header><b>ORIÓN · EQUIPO</b><span id="yo"></span></header>
<div id="entrar" hidden>
  <p>Pega la clave que te dio David.</p>
  <input id="clave" type="password" autocomplete="off">
  <button id="guardar">Entrar</button>
  <p id="aviso" class="error"></p>
</div>
<div id="mensajes" hidden></div>
<div id="pensando"></div>
<form id="form" hidden>
  <textarea id="texto" placeholder="Pregúntale a Orión. Enter envía, Shift+Enter baja de línea."></textarea>
  <button>Enviar</button>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let clave = "", nombre = "", ultimo = 0;
try { clave = localStorage.getItem("orion-equipo-clave") || ""; } catch (e) {}
// El enlace de David trae la clave en el fragmento (#clave=...), que nunca viaja al servidor ni queda en registros.
const enlace = new URLSearchParams(location.hash.slice(1)).get("clave");
if (enlace) { clave = enlace; history.replaceState(null, "", location.pathname); }

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { ...opciones, headers: { "Authorization": "Bearer " + clave,
    "Content-Type": "application/json" } });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(datos.error || r.status), { codigo: r.status });
  return datos;
}

function pintar(m) {
  const div = document.createElement("div");
  div.className = "m" + (m.de === "orion" ? " orion" : m.de === nombre ? " mio" : "");
  const quien = document.createElement("small");
  quien.textContent = (m.de === "orion" ? "Orión" : m.de) + " · " + m.hora;
  div.append(quien, document.createTextNode(m.texto));
  $("mensajes").append(div);
}

async function leer() {
  try {
    const d = await api("/api/sala?desde=" + ultimo);
    const abajo = $("mensajes").scrollHeight - $("mensajes").scrollTop - $("mensajes").clientHeight < 80;
    for (const m of d.mensajes) { pintar(m); ultimo = m.n; }
    if (d.mensajes.length && abajo) $("mensajes").scrollTop = $("mensajes").scrollHeight;
    $("pensando").textContent = d.ocupado ? "Orión está trabajando…" : "";
  } catch (e) {
    if (e.codigo === 401) return salir();
  }
}

function salir(mensaje) {
  try { localStorage.removeItem("orion-equipo-clave"); } catch (e) {}
  $("entrar").hidden = false; $("mensajes").hidden = $("form").hidden = true;
  $("aviso").textContent = mensaje || "";
}

async function entrar() {
  try {
    nombre = (await api("/api/yo")).nombre;
  } catch (e) {
    return salir(clave ? (e.codigo === 429 ? "Demasiados intentos, espera unos minutos." : "Esa clave no sirve.") : "");
  }
  try { localStorage.setItem("orion-equipo-clave", clave); } catch (e) {}
  $("yo").textContent = nombre;
  $("entrar").hidden = true; $("mensajes").hidden = $("form").hidden = false;
  await leer();
  $("mensajes").scrollTop = $("mensajes").scrollHeight;
  setInterval(leer, 2500);
}

$("guardar").onclick = () => { clave = $("clave").value.trim(); entrar(); };
$("texto").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const texto = $("texto").value.trim();
  if (!texto) return;
  try {
    await api("/api/pedir", { method: "POST", body: JSON.stringify({ texto }) });
    $("texto").value = "";
    leer();
  } catch (err) {
    $("pensando").textContent = "No se envió: " + err.message;
  }
};
entrar();
</script>
</body>
</html>
