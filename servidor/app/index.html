<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05121c">
<title>JARVIS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
  :root {
    --fondo: #05121c; --panel: #0b2131; --borde: #17405a; --texto: #d8f3ff; --tenue: #7aa6bd;
    --acento: #2ad4ff; --yo: #12405a; --error: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--borde); }
  header h1 { font-size: 18px; letter-spacing: .2em; margin: 0; color: var(--acento); flex: 1; }
  header button { background: none; border: 1px solid var(--borde); color: var(--tenue); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 13px; }
  header button.activo { color: var(--acento); border-color: var(--acento); }
  #estado { font-size: 12px; color: var(--tenue); padding: 4px 16px; min-height: 22px; }
  #chat { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 86%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.jarvis { background: var(--panel); border: 1px solid var(--borde); align-self: flex-start; border-bottom-left-radius: 4px; }
  .m.yo { background: var(--yo); align-self: flex-end; border-bottom-right-radius: 4px; }
  .m small { display: block; color: var(--tenue); font-size: 11px; margin-top: 4px; }
  .pensando { align-self: flex-start; color: var(--tenue); font-size: 14px; }
  .pensando::after { content: "…"; animation: puntos 1.2s infinite; }
  @keyframes puntos { 50% { opacity: .2; } }
  #rapidos { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
  #rapidos button { flex: none; background: var(--panel); color: var(--texto); border: 1px solid var(--borde);
    border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid var(--borde); }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--texto); border: 1px solid var(--borde);
    border-radius: 12px; padding: 10px 12px; font: inherit; max-height: 140px; }
  form button { width: 48px; border-radius: 12px; border: 1px solid var(--borde); background: var(--panel);
    color: var(--acento); font-size: 20px; }
  #mic.escuchando { background: var(--acento); color: var(--fondo); }
  .m a.abrir { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 16px; background: #1db954;
    color: #04130a; font-weight: 600; text-decoration: none; font-size: 14px; }
  #panel { display: none; padding: 8px 16px; border-bottom: 1px solid var(--borde); max-height: 45dvh; overflow-y: auto; font-size: 14px; }
  #panel.abierto { display: block; }
  #panel h2 { font-size: 13px; color: var(--acento); letter-spacing: .1em; margin: 10px 0 4px; }
  #panel ul { margin: 0; padding-left: 18px; }
  #panel .hecha { text-decoration: line-through; color: var(--tenue); }
  #entrar { position: fixed; inset: 0; background: var(--fondo); display: none; flex-direction: column;
    justify-content: center; gap: 12px; padding: 24px; }
  #entrar.visible { display: flex; }
  #entrar input { background: var(--panel); color: var(--texto); border: 1px solid var(--borde); border-radius: 10px;
    padding: 12px; font: inherit; }
  #entrar button { background: var(--acento); color: var(--fondo); border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; }
  #entrar p { color: var(--tenue); margin: 0; font-size: 14px; }
  .error { color: var(--error); }
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <button id="btnPanel" type="button">Hoy</button>
  <button id="btnEscucha" type="button" title="Escuchar siempre: di &quot;Jarvis&quot; y lo que quieras">Jarvis</button>
  <button id="btnVoz" type="button" title="Leer las respuestas en voz alta">Voz</button>
</header>
<div id="panel"></div>
<div id="estado"></div>
<main id="chat"></main>
<nav id="rapidos"></nav>
<form id="form">
  <button id="mic" type="button" title="Hablar">🎙</button>
  <textarea id="texto" rows="1" placeholder="Pídele algo a JARVIS" enterkeyhint="send"></textarea>
  <button type="submit" title="Enviar">➤</button>
</form>

<div id="entrar">
  <h1 style="color:var(--acento);letter-spacing:.2em;margin:0">JARVIS</h1>
  <p>Pega la clave de la app (JARVIS_API_TOKEN en el .env del servidor). Se guarda solo en este celular.</p>
  <input id="clave" type="password" autocomplete="off" placeholder="Clave">
  <button id="guardarClave" type="button">Entrar</button>
  <p id="errorClave" class="error"></p>
</div>

<script>
const $ = (id) => document.getElementById(id)
const leer = (k) => { try { return localStorage.getItem(k) } catch { return null } }
const escribir = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} }

let token = leer('jarvis-token') || ''
let ultimo = 0
let ocupado = false
let vozActiva = leer('jarvis-voz') === '1'
let primeraCarga = true
let hablando = false
// "Manos libres" (botón Jarvis): se define más abajo; hasta entonces no hace nada.
let escucha = { pausar() {}, reanudar() {} }

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { ...opciones, headers: { ...(opciones.headers || {}), Authorization: 'Bearer ' + token } })
  if (r.status === 401) { pedirClave('La clave no es correcta.'); throw new Error('token') }
  if (!r.ok) throw new Error('HTTP ' + r.status)
  return r.json()
}

function pedirClave(error = '') {
  $('errorClave').textContent = error
  $('entrar').classList.add('visible')
}

$('guardarClave').onclick = async () => {
  token = $('clave').value.trim()
  escribir('jarvis-token', token)
  $('entrar').classList.remove('visible')
  iniciar()
}

function burbuja(m) {
  const div = document.createElement('div')
  div.className = 'm ' + (m.de === 'yo' ? 'yo' : 'jarvis')
  div.textContent = m.texto
  if (m.abrir) {
    // spotify:playlist:ID -> https://open.spotify.com/playlist/ID (Android lo abre en la app de Spotify)
    const a = document.createElement('a')
    a.className = 'abrir'
    a.href = 'https://open.spotify.com/' + m.abrir.replace(/^spotify:/, '').replace(/:/g, '/')
    a.target = '_blank'
    a.rel = 'noopener'
    a.textContent = '▶ Abrir en Spotify'
    div.appendChild(document.createElement('br'))
    div.appendChild(a)
  }
  const hora = document.createElement('small')
  hora.textContent = m.hora
  div.appendChild(hora)
  return div
}

function pintarPensando() {
  let p = document.querySelector('.pensando')
  if (ocupado && !p) {
    p = document.createElement('div')
    p.className = 'pensando'
    p.textContent = 'JARVIS está trabajando'
    $('chat').appendChild(p)
  } else if (!ocupado && p) p.remove()
}

function hablar(texto) {
  if (!vozActiva || !('speechSynthesis' in window)) return
  const u = new SpeechSynthesisUtterance(texto.replace(/[*_#`>]/g, ''))
  u.lang = 'es-ES'
  // Mientras JARVIS habla no escuchamos, para que no se oiga a sí mismo.
  u.onend = u.onerror = () => { hablando = false; escucha.reanudar() }
  hablando = true
  escucha.pausar()
  speechSynthesis.cancel()
  speechSynthesis.speak(u)
}

async function actualizar() {
  try {
    const d = await api('/api/conversacion?desde=' + ultimo)
    const chat = $('chat')
    const abajo = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80
    document.querySelector('.pensando')?.remove()
    for (const m of d.mensajes) {
      chat.appendChild(burbuja(m))
      ultimo = m.n
      if (m.de === 'jarvis' && !primeraCarga) hablar(m.texto)
    }
    primeraCarga = false
    ocupado = d.ocupado
    pintarPensando()
    if (abajo || d.mensajes.length) chat.scrollTop = chat.scrollHeight
    $('estado').textContent = ''
  } catch (e) {
    if (e.message !== 'token') $('estado').textContent = 'Sin conexión con el servidor. ¿Tailscale está encendido?'
  }
}

async function enviar(texto) {
  texto = texto.trim()
  if (!texto) return
  $('texto').value = ''
  ajustarAlto()
  try {
    await api('/api/pedir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto }) })
    ocupado = true
    await actualizar()
    programar()
  } catch (e) {
    if (e.message !== 'token') { $('estado').textContent = 'No se pudo enviar. Revisa la conexión.'; $('texto').value = texto }
  }
}

$('form').onsubmit = (e) => { e.preventDefault(); enviar($('texto').value) }
$('texto').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviar($('texto').value) }
})
function ajustarAlto() { const t = $('texto'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px' }
$('texto').addEventListener('input', ajustarAlto)

// Dictado con el reconocimiento de voz del propio celular (Chrome en Android, Safari en iPhone).
const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition
if (!Reconocer) $('mic').style.display = 'none'
else {
  let rec = null
  $('mic').onclick = () => {
    if (rec) { rec.stop(); return }
    escucha.pausar()
    rec = new Reconocer()
    rec.lang = 'es-CO'
    rec.interimResults = true
    let final = ''
    rec.onresult = (e) => {
      let parcial = ''
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript
        else parcial += e.results[i][0].transcript
      }
      $('texto').value = final + parcial
      ajustarAlto()
    }
    rec.onend = () => {
      $('mic').classList.remove('escuchando')
      rec = null
      escucha.reanudar()
      if (final.trim()) enviar(final)
    }
    rec.onerror = (e) => { $('estado').textContent = 'Micrófono: ' + e.error }
    $('mic').classList.add('escuchando')
    rec.start()
  }
}

// Manos libres: con la app abierta, escucha todo el tiempo y atiende lo que digas después de "Jarvis".
// "Jarvis, pon música" va directo; si solo dices "Jarvis", lo siguiente que digas es la orden.
// La pantalla se mantiene encendida mientras está activo (el navegador no deja escuchar con ella apagada).
if (Reconocer) {
  const PALABRA = /\b(jarvis|jarvi|yarvis|harvis|jervis|yervis)\b[\s,.:]*/i
  let activo = false, pausado = false, rec = null, esperaOrden = 0, bloqueo = null
  const estado = (t) => { $('estado').textContent = t }
  const pedirPantalla = async () => {
    try { if (activo && 'wakeLock' in navigator && !bloqueo) bloqueo = await navigator.wakeLock.request('screen'); bloqueo?.addEventListener('release', () => { bloqueo = null }) } catch {}
  }
  const arrancar = () => {
    if (!activo || pausado || rec) return
    rec = new Reconocer()
    rec.lang = 'es-CO'
    rec.continuous = true
    rec.interimResults = false
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (!e.results[i].isFinal) continue
        const dicho = e.results[i][0].transcript.trim()
        const m = dicho.match(PALABRA)
        if (m) {
          const orden = dicho.slice(m.index + m[0].length).trim()
          if (orden) { esperaOrden = 0; enviar(orden) } else { esperaOrden = Date.now() + 8000; estado('Te escucho…') }
        } else if (esperaOrden > Date.now() && dicho) {
          esperaOrden = 0
          enviar(dicho)
        }
      }
    }
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        activo = false
        pintar()
        estado('Dale permiso de micrófono a la página para usar "Jarvis".')
      }
    }
    // Chrome corta la escucha tras unos segundos de silencio: la volvemos a abrir.
    rec.onend = () => { rec = null; if (activo && !pausado) setTimeout(arrancar, 250) }
    try { rec.start() } catch { rec = null }
  }
  const pintar = () => {
    $('btnEscucha').classList.toggle('activo', activo)
    if (!activo && $('estado').textContent === 'Te escucho…') estado('')
  }
  escucha = {
    pausar() { pausado = true; try { rec?.abort() } catch {} rec = null },
    reanudar() { if (hablando) return; pausado = false; setTimeout(arrancar, 300) },
  }
  $('btnEscucha').onclick = () => {
    activo = !activo
    escribir('jarvis-escucha', activo ? '1' : '0')
    if (activo) {
      vozActiva = true                     // con manos libres, las respuestas se leen en voz alta
      escribir('jarvis-voz', '1')
      pintarVoz()
      pausado = false
      pedirPantalla()
      arrancar()
      estado('Di "Jarvis" y lo que necesites.')
    } else {
      escucha.pausar()
      bloqueo?.release().catch(() => {})
      bloqueo = null
    }
    pintar()
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { try { rec?.abort() } catch {} rec = null }
    else if (activo) { pedirPantalla(); arrancar() }
  })
} else {
  $('btnEscucha').style.display = 'none'
}

function pintarVoz() { $('btnVoz').classList.toggle('activo', vozActiva) }
$('btnVoz').onclick = () => {
  vozActiva = !vozActiva
  escribir('jarvis-voz', vozActiva ? '1' : '0')
  if (!vozActiva && 'speechSynthesis' in window) speechSynthesis.cancel()
  pintarVoz()
}

async function cargarResumen() {
  try {
    const d = await api('/api/resumen')
    const rapidos = $('rapidos')
    rapidos.replaceChildren(...d.comandos.map((c) => {
      const b = document.createElement('button')
      b.type = 'button'
      b.textContent = c.etiqueta
      b.onclick = () => enviar(c.pedido)
      return b
    }))
    const panel = $('panel')
    const seccion = (titulo, items) => {
      const h = document.createElement('h2'); h.textContent = titulo
      const ul = document.createElement('ul')
      for (const it of items) { const li = document.createElement('li'); li.textContent = it.texto; if (it.clase) li.className = it.clase; ul.appendChild(li) }
      if (!items.length) { const li = document.createElement('li'); li.textContent = 'Nada por ahora'; ul.appendChild(li) }
      return [h, ul]
    }
    panel.replaceChildren(
      ...seccion('PRIORIDADES DE HOY', d.plan.prioridades.map((p) => ({ texto: p.texto, clase: p.hecha ? 'hecha' : '' }))),
      ...seccion('AGENDA', d.plan.agenda.map((a) => ({ texto: a.hora + '  ' + a.texto }))),
      ...seccion('TAREAS', d.tareas.map((t) => ({ texto: t.texto + (t.fecha ? '  (' + t.fecha + ')' : '') }))),
    )
  } catch {}
}
$('btnPanel').onclick = () => { $('panel').classList.toggle('abierto'); $('btnPanel').classList.toggle('activo'); cargarResumen() }

let reloj = null
function iniciar() {
  if (!token) return pedirClave()
  actualizar()
  cargarResumen()
  programar()
}
// Mientras JARVIS trabaja se mira cada 2 s; si no, cada 10 s.
function programar() {
  clearTimeout(reloj)
  reloj = setTimeout(async () => { if (!document.hidden) await actualizar(); programar() }, ocupado ? 2000 : 10000)
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) actualizar() })

pintarVoz()
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
iniciar()
</script>
</body>
</html>
